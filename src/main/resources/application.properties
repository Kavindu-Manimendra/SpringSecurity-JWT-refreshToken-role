spring.application.name=security-jwt-demo
server.port=4040

spring.datasource.url=${DAAAB_URL}
spring.datasource.username=${DAAAB_USERNAME}
spring.datasource.password=${DAAAB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

auth.token.expirationInMils=60000
# 7 days in seconds = 604800
auth.refreshToken.expirationInSeconds=180 
jwt.secret_key=${JWT_SECRET_KEY}
